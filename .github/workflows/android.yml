name: Build DiPlay P660 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
  DIPLAY_RELEASE_VERSION: "0.2.21"
  DIPLAY_RELEASE_REPO: "shihabal3amri/DiPlay"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses and refresh package index
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          "$SDKMANAGER" --update >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;36.0.0" \
            || echo "::warning::sdkmanager install failed; Gradle will auto-download missing SDK components"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Verify Gradle environment
        run: |
          java -version
          ./gradlew --version

      # The repository intentionally never stores the accessory identity, so the CarPlay
      # authentication assets are taken from the upstream release APK at build time.
      # They stay in the runner temp dir and are never committed or uploaded separately.
      - name: Provision MFi identity from upstream release
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME="DiPlay-${DIPLAY_RELEASE_VERSION}.apk"
          BASE="https://github.com/${DIPLAY_RELEASE_REPO}/releases/download/v${DIPLAY_RELEASE_VERSION}"
          WORK="$RUNNER_TEMP/release"
          ASSETS="$RUNNER_TEMP/runtime-assets"
          mkdir -p "$WORK" "$ASSETS"
          curl -fsSL --retry 3 --retry-delay 2 -o "$WORK/$APK_NAME" "$BASE/$APK_NAME"
          curl -fsSL --retry 3 --retry-delay 2 -o "$WORK/SHA256SUMS.txt" "$BASE/SHA256SUMS.txt"
          ( cd "$WORK" && grep -E "  ${APK_NAME}\$" SHA256SUMS.txt | sha256sum -c - )
          unzip -o -q "$WORK/$APK_NAME" 'assets/offline-mfi/*' -d "$WORK/unpacked"
          mkdir -p "$ASSETS/offline-mfi"
          cp "$WORK/unpacked/assets/offline-mfi/identity.pk8" "$ASSETS/offline-mfi/identity.pk8"
          cp "$WORK/unpacked/assets/offline-mfi/certificate.p7b" "$ASSETS/offline-mfi/certificate.p7b"
          test -s "$ASSETS/offline-mfi/identity.pk8"
          test -s "$ASSETS/offline-mfi/certificate.p7b"
          rm -rf "$WORK"
          ls -l "$ASSETS/offline-mfi"
          echo "dir=$ASSETS" >> "$GITHUB_OUTPUT"

      - name: Build standalone debug APK with MFi identity
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ steps.auth.outputs.dir }}
        run: ./gradlew :mobile:assembleStandaloneDebug --stacktrace --no-daemon

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find mobile/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK=$APK"

      - name: Verify MFi identity is inside the APK
        shell: bash
        run: |
          APK="${{ steps.apk.outputs.path }}"
          unzip -l "$APK" | grep -q 'assets/offline-mfi/identity.pk8'
          unzip -l "$APK" | grep -q 'assets/offline-mfi/certificate.p7b'
          echo "identity.pk8 sha256: $(unzip -p "$APK" assets/offline-mfi/identity.pk8 | sha256sum | cut -d' ' -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-P660-standalone-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
